name: Update IMAX Now Playing

# Runs every Saturday at 12:00 UTC (= Friday 8pm EDT / 7pm EST) — a day
# or two after a fresh IMAX release weekend, by which point Wikipedia
# editors have updated the list. Also triggerable manually via the
# "Run workflow" button on the Actions tab.

on:
  schedule:
    - cron: '0 12 * * 6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Scrape Wikipedia's IMAX DMR film list
        run: python scripts/update_imax_now_playing.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet static/imax-now-playing.json; then
            echo "No changes — sticky is the same as last run."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/imax-now-playing.json
            git commit -m "chore: update IMAX now playing from r/imax weekly sticky"
            git push
          fi
