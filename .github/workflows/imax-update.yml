name: Update IMAX Now Playing

# Twice a week:
# - Friday 22:00 UTC (= 6pm EDT / 5pm EST) — catches opening-day releases
#   once Wikipedia editors have logged them, so the page goes live with
#   the new IMAX feature on release day rather than the next morning.
# - Saturday 12:00 UTC (= 8am EDT / 7am EST) — backstop in case Friday's
#   run was too early relative to the Wikipedia edit.
# Also triggerable on demand via the "Run workflow" button on Actions.

on:
  schedule:
    - cron: '0 22 * * 5'
    - cron: '0 12 * * 6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Scrape Wikipedia's IMAX DMR film list
        run: python scripts/update_imax_now_playing.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet static/imax-now-playing.json; then
            echo "No changes — sticky is the same as last run."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/imax-now-playing.json
            git commit -m "chore: update IMAX now playing from r/imax weekly sticky"
            git push
          fi
