name: Update IMAX Now Playing

# Runs every Friday at 04:00 UTC (= Thursday 11pm EST / 12am EDT) — a few
# hours after r/imax mods post the new weekly discussion thread. Also
# triggerable manually via the "Run workflow" button on the Actions tab.

on:
  schedule:
    - cron: '0 4 * * 5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Scrape r/imax weekly sticky
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/update_imax_now_playing.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet static/imax-now-playing.json; then
            echo "No changes — sticky is the same as last run."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/imax-now-playing.json
            git commit -m "chore: update IMAX now playing from r/imax weekly sticky"
            git push
          fi
